name: hermes-phone-use
version: "0.2.0"
description: "Operate your real phone from any Hermes, such as one on a Linux server, through Pinky running on the Mac the phone is connected to. Set the Pinky URL and token; approvals and hand-offs wait on their own and are announced in chat, and screenshots come back as images."
author: "Bruce Xu"
requires_hermes: ">=0.22.7"
provides_tools:
  - phone_apps
  - phone_batch
  - phone_connect
  - phone_files
  - phone_handoff
  - phone_key
  - phone_launch
  - phone_observe
  - phone_release
  - phone_request_approval
  - phone_swipe
  - phone_tap
  - phone_type
  - phone_wait_for
requires_env:
  - name: PINKY_TOKEN
    description: "Pinky agent token: run `pinky token` on the Mac, or copy it from Pinky Settings > Remote agents."
    secret: true
config_schema:
  url:
    type: str
    default: ""
    label: "Pinky URL"
    description: "Pinky's Remote agents address on your private network, e.g. 100.101.102.103:7465 (Tailscale IP of the Mac)."
    required: true
